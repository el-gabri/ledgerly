[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly-orchestrator"
version = "0.1.0"
description = "Deterministic LangGraph demo for customer-support orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
openai = ["openai>=1.40"]
embeddings = ["sentence-transformers>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ledgerly*"]
